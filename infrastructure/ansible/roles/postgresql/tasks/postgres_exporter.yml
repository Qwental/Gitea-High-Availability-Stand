- name: Check if Postgres Exporter binary exists
  ansible.builtin.stat:
    path: /usr/local/bin/postgres_exporter
  register: pg_exporter_bin

- name: Download Postgres Exporter archive
  ansible.builtin.get_url:
    url: "https://github.com/prometheus-community/postgres_exporter/releases/download/v{{ pg_exporter_version }}/postgres_exporter-{{ pg_exporter_version }}.linux-{{ target_arch }}.tar.gz"
    dest: "/tmp/postgres_exporter-{{ pg_exporter_version }}.linux-{{ target_arch }}.tar.gz"
    timeout: 120
    owner: root
    group: root
    mode: "0644"
  register: pg_exporter_download
  until: pg_exporter_download is succeeded
  retries: 5
  delay: 10
  when: not pg_exporter_bin.stat.exists

- name: Extract Postgres Exporter binary
  ansible.builtin.unarchive:
    src: "/tmp/postgres_exporter-{{ pg_exporter_version }}.linux-{{ target_arch }}.tar.gz"
    dest: /usr/local/bin/
    remote_src: yes
    extra_opts:
      - "--strip-components=1"
      - "postgres_exporter-{{ pg_exporter_version }}.linux-{{ target_arch }}/postgres_exporter"
    creates: /usr/local/bin/postgres_exporter
  notify: restart postgres_exporter
  when: not pg_exporter_bin.stat.exists

- name: Remove temporary Postgres Exporter archive
  ansible.builtin.file:
    path: "/tmp/postgres_exporter-{{ pg_exporter_version }}.linux-{{ target_arch }}.tar.gz"
    state: absent
  when: not pg_exporter_bin.stat.exists and pg_exporter_download is changed
