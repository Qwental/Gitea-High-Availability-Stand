---
- name: Download and install Postgres Exporter
  ansible.builtin.unarchive:
    src: "https://github.com/prometheus-community/postgres_exporter/releases/downlo\
      ad/v{{ pg_exporter_version }}/postgres_exporter-{{ pg_exporter_version
      }}.linux-{{ target_arch }}.tar.gz"
    dest: /usr/local/bin/
    remote_src: yes
    extra_opts:
      - "--strip-components=1"
      - "postgres_exporter-{{ pg_exporter_version }}.linux-{{ target_arch
        }}/postgres_exporter"
    creates: /usr/local/bin/postgres_exporter
  notify: restart postgres_exporter

- name: Create postgres_exporter PostgreSQL user
  community.postgresql.postgresql_user:
    name: postgres_exporter
    password: "{{ pg_exporter_password }}"
    role_attr_flags: LOGIN
  become_user: postgres
  when: is_master | bool
  register: postgres_exporter_user
  until: postgres_exporter_user is success
  retries: 5
  delay: 10

- name: Grant pg_monitor role to postgres_exporter
  community.postgresql.postgresql_membership:
    group: pg_monitor
    target_roles:
      - postgres_exporter
  become_user: postgres
  when: is_master | bool
  register: postgres_exporter_grant
  until: postgres_exporter_grant is success
  retries: 5
  delay: 10

- name: Deploy postgres_exporter systemd service
  ansible.builtin.template:
    src: postgres_exporter.service.j2
    dest: /etc/systemd/system/postgres_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: restart postgres_exporter

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: yes

- name: Enable and start postgres_exporter
  ansible.builtin.service:
    name: postgres_exporter
    state: started
    enabled: yes
  register: postgres_exporter_service
  until: postgres_exporter_service is success
  retries: 5
  delay: 10
