---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: yes
  check_mode: no
  register: apt_update_status
  until: apt_update_status is success
  retries: 3
  delay: 10

- name: Set timezone to Europe/Moscow
  community.general.timezone:
    name: Europe/Moscow
    
- name: Install packages
  ansible.builtin.apt:
    name:
      - "postgresql-{{ pg_version }}"
      - "postgresql-client-{{ pg_version }}"
      - "postgresql-{{ pg_version }}-repmgr"
      - repmgr
      - python3-psycopg2
      - acl
    state: present
  register: apt_install_status
  until: apt_install_status is success
  retries: 5
  delay: 15

- name: Check if PostgreSQL service exists
  ansible.builtin.stat:
    path: /etc/systemd/system/postgresql.service
  register: custom_pg_service

- name: Stop and disable legacy service
  ansible.builtin.systemd:
    name: "postgresql@{{ pg_version }}-main"
    state: stopped
    enabled: no
  ignore_errors: true
  when: not custom_pg_service.stat.exists

- name: Stop umbrella postgresql service if active
  ansible.builtin.systemd:
    name: postgresql
    state: stopped
  ignore_errors: true
  when: not custom_pg_service.stat.exists

- name: Mask template service to prevent auto-start
  ansible.builtin.systemd:
    name: "postgresql@.service"
    masked: yes
  ignore_errors: true
  when: not custom_pg_service.stat.exists

- name: Remove systemd override directory
  ansible.builtin.file:
    path: /etc/systemd/system/postgresql@.service.d
    state: absent
  when: not custom_pg_service.stat.exists

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: yes
  when: not custom_pg_service.stat.exists

- name: Wait until port 5432 is free
  ansible.builtin.wait_for:
    port: 5432
    state: absent
    timeout: 30
  ignore_errors: true
  when: not custom_pg_service.stat.exists

- name: Unmask postgresql.service before writing custom unit
  ansible.builtin.systemd:
    name: postgresql.service
    masked: no
  ignore_errors: true

- name: Create custom PostgreSQL systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/postgresql.service
    content: |
      [Unit]
      Description=PostgreSQL Database Server
      After=network.target syslog.target

      [Service]
      Type=simple
      User=postgres
      Group=postgres
      ExecStart=/usr/lib/postgresql/{{ pg_version }}/bin/postgres \
        -D {{ pg_data_dir }} \
        -c config_file={{ pg_conf_dir }}/postgresql.conf
      Restart=on-failure
      RestartSec=5
      StandardOutput=journal
      StandardError=journal

      [Install]
      WantedBy=multi-user.target
    mode: "0644"

- name: Reload systemd after creating custom service
  ansible.builtin.systemd:
    daemon_reload: yes

- name: Ensure PostgreSQL socket directory exists
  ansible.builtin.file:
    path: /var/run/postgresql
    state: directory
    owner: postgres
    group: postgres
    mode: "2775"



- name: Ensure PostgreSQL configuration directory exists
  ansible.builtin.file:
    path: "{{ pg_conf_dir }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0755"

- name: Deploy postgresql.conf
  ansible.builtin.template:
    src: postgresql.conf.j2
    dest: "{{ pg_conf_dir }}/postgresql.conf"
    owner: postgres
    group: postgres
    mode: "0644"

- name: Deploy pg_hba.conf
  ansible.builtin.template:
    src: pg_hba.conf.j2
    dest: "{{ pg_conf_dir }}/pg_hba.conf"
    owner: postgres
    group: postgres
    mode: "0640"

- name: Deploy pg_ident.conf
  ansible.builtin.copy:
    content: "# PostgreSQL User Name Maps\n"
    dest: "{{ pg_conf_dir }}/pg_ident.conf"
    owner: postgres
    group: postgres
    mode: "0644"

- name: Deploy repmgr.conf
  ansible.builtin.template:
    src: repmgr.conf.j2
    dest: /etc/repmgr.conf
    owner: postgres
    group: postgres
    mode: "0644"

- name: Deploy .pgpass for postgres user
  ansible.builtin.template:
    src: pgpass.j2
    dest: /var/lib/postgresql/.pgpass
    owner: postgres
    group: postgres
    mode: "0600"

- name: Configure /etc/default/repmgrd
  ansible.builtin.copy:
    dest: /etc/default/repmgrd
    content: |
      REPMGRD_ENABLED=yes
      REPMGRD_CONF="/etc/repmgr.conf"
    owner: root
    group: root
    mode: "0644"

- name: Ensure repmgr log file exists
  ansible.builtin.file:
    path: /var/log/postgresql/repmgr.log
    state: touch
    owner: postgres
    group: postgres
    mode: "0664"
  changed_when: false

- name: Check if PostgreSQL data directory is initialized
  ansible.builtin.find:
    paths: "{{ pg_data_dir }}"
  register: pg_data_check

- name: Initialize PostgreSQL database cluster
  ansible.builtin.command: >
    /usr/lib/postgresql/{{ pg_version }}/bin/initdb -D {{ pg_data_dir }}
  become_user: postgres
  when: pg_data_check.matched == 0

- name: Ensure PostgreSQL is started and enabled
  ansible.builtin.systemd:
    name: postgresql
    state: started
    enabled: yes
  register: pg_start_result
  failed_when: false

- name: Wait for PostgreSQL to accept connections (port check)
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 5432
    state: started
    timeout: 60
    delay: 2

- name: Check PostgreSQL service active status
  ansible.builtin.systemd:
    name: postgresql
  register: pg_service_check
  failed_when: pg_service_check.status.ActiveState != 'active'

- name: Create repmgr user (Master)
  community.postgresql.postgresql_user:
    name: repmgr
    password: "{{ pg_repl_password }}"
    role_attr_flags: "SUPERUSER,REPLICATION"
    login_unix_socket: "/var/run/postgresql"
  become_user: postgres
  when: is_master | bool

- name: Create repmgr database (Master)
  community.postgresql.postgresql_db:
    name: repmgr
    owner: repmgr
  become_user: postgres
  when: is_master | bool

- name: Set password for postgres admin user (Master)
  community.postgresql.postgresql_user:
    name: postgres
    password: "{{ pg_admin_password }}"
  become_user: postgres
  when: is_master | bool

- name: Register Master node in Repmgr
  ansible.builtin.command: repmgr primary register -F
  become_user: postgres
  register: repmgr_primary
  changed_when: "'registered as primary' in repmgr_primary.stdout"
  failed_when:
    - repmgr_primary.rc != 0
    - "'already registered' not in repmgr_primary.stderr and 'already registered' not in repmgr_primary.stdout"
  retries: 3
  delay: 5
  until: repmgr_primary.rc == 0 or 'already registered' in repmgr_primary.stderr or 'already registered' in repmgr_primary.stdout
  when: is_master | bool

- name: Check if replica is initialized (Slave)
  ansible.builtin.stat:
    path: "{{ pg_data_dir }}/standby.signal"
  register: standby_signal
  when: not is_master | bool

- name: Initialize replica via Repmgr (Slave)
  block:
    - name: Stop PostgreSQL on Slave
      ansible.builtin.service:
        name: postgresql
        state: stopped

    - name: Wipe PG data directory
      ansible.builtin.file:
        path: "{{ pg_data_dir }}"
        state: absent

    - name: Clone standby via repmgr
      ansible.builtin.command: >
        repmgr -h {{ db_node_01 }} -U repmgr -d repmgr -f /etc/repmgr.conf
        standby clone -F
      become_user: postgres
      environment:
        PGPASSWORD: "{{ pg_repl_password }}"
      register: clone_result
      retries: 3
      delay: 10
      until: clone_result.rc == 0

    - name: Start PostgreSQL on Slave
      ansible.builtin.service:
        name: postgresql
        state: started

    - name: Register Standby node in Repmgr
      ansible.builtin.command: repmgr standby register -F
      become_user: postgres
      register: repmgr_standby
      changed_when: "'registered as standby' in repmgr_standby.stdout"
      failed_when:
        - repmgr_standby.rc != 0
        - "'already registered' not in repmgr_standby.stderr and 'already registered' not in repmgr_standby.stdout"
      retries: 3
      delay: 5
      until: repmgr_standby.rc == 0 or 'already registered' in repmgr_standby.stderr or 'already registered' in repmgr_standby.stdout
  when: not is_master | bool and not standby_signal.stat.exists

- name: Setup Gitea database
  ansible.builtin.include_tasks: gitea.yml
  when: is_master | bool

- name: Ensure repmgrd is started and enabled
  ansible.builtin.service:
    name: repmgrd
    state: started
    enabled: yes

- name: Install postgres_exporter
  ansible.builtin.include_tasks: postgres_exporter.yml
