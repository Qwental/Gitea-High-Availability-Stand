---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: yes
  check_mode: no
  register: apt_update_status
  until: apt_update_status is success
  retries: 3
  delay: 10

- name: Install PostgreSQL and Repmgr packages
  ansible.builtin.apt:
    name:
      - "postgresql-{{ pg_version }}"
      - "postgresql-client-{{ pg_version }}"
      - "postgresql-{{ pg_version }}-repmgr"
      - repmgr
      - python3-psycopg2
      - acl
    state: present
  register: apt_install_status
  until: apt_install_status is success
  retries: 5
  delay: 15

- name: Ensure PostgreSQL socket directory exists
  ansible.builtin.file:
    path: /var/run/postgresql
    state: directory
    owner: postgres
    group: postgres
    mode: "2775"

- name: Set timezone to Europe/Moscow
  ansible.builtin.file:
    src: /usr/share/zoneinfo/Europe/Moscow
    dest: /etc/localtime
    state: link
    force: yes

- name: Update /etc/timezone file
  ansible.builtin.copy:
    content: "Europe/Moscow\n"
    dest: /etc/timezone
    owner: root
    group: root
    mode: "0644"

- name: Create systemd override directory for PostgreSQL
  ansible.builtin.file:
    path: /etc/systemd/system/postgresql@.service.d
    state: directory
    mode: "0755"

- name: Override PostgreSQL systemd unit for Docker compatibility
  ansible.builtin.copy:
    dest: /etc/systemd/system/postgresql@.service.d/override.conf
    content: |
      [Service]
      Type=simple
      User=postgres
      Group=postgres
      ExecStart=
      ExecStart=/usr/lib/postgresql/{{ pg_version }}/bin/postgres -D {{ pg_data_dir }} -c config_file={{ pg_conf_dir }}/postgresql.conf
      PIDFile=
    mode: "0644"

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: yes

- name: Ensure PostgreSQL configuration directory exists
  ansible.builtin.file:
    path: "{{ pg_conf_dir }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0755"

- name: Deploy postgresql.conf
  ansible.builtin.template:
    src: postgresql.conf.j2
    dest: "{{ pg_conf_dir }}/postgresql.conf"
    owner: postgres
    group: postgres
    mode: "0644"
  notify: restart postgresql

- name: Deploy pg_hba.conf
  ansible.builtin.template:
    src: pg_hba.conf.j2
    dest: "{{ pg_conf_dir }}/pg_hba.conf"
    owner: postgres
    group: postgres
    mode: "0640"
  notify: restart postgresql

- name: Deploy repmgr.conf
  ansible.builtin.template:
    src: repmgr.conf.j2
    dest: /etc/repmgr.conf
    owner: postgres
    group: postgres
    mode: "0644"

- name: Deploy .pgpass for postgres user
  ansible.builtin.template:
    src: pgpass.j2
    dest: /var/lib/postgresql/.pgpass
    owner: postgres
    group: postgres
    mode: "0600"

- name: Configure /etc/default/repmgrd for Ubuntu
  ansible.builtin.copy:
    dest: /etc/default/repmgrd
    content: |
      REPMGRD_ENABLED=yes
      REPMGRD_CONF="/etc/repmgr.conf"
    owner: root
    group: root
    mode: "0644"

- name: Ensure repmgr log file exists with correct permissions
  ansible.builtin.file:
    path: /var/log/postgresql/repmgr.log
    state: touch
    owner: postgres
    group: postgres
    mode: "0664"
  changed_when: false

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Check if PostgreSQL data directory is initialized
  ansible.builtin.find:
    paths: "{{ pg_data_dir }}"
  register: pg_data_check

- name: Initialize PostgreSQL database cluster
  ansible.builtin.command: /usr/lib/postgresql/{{ pg_version }}/bin/initdb -D {{ pg_data_dir }}
  become_user: postgres
  when: pg_data_check.matched == 0

- name: Ensure PostgreSQL is started (Master only for initial setup)
  ansible.builtin.service:
    name: postgresql
    state: started
    enabled: yes
  when: is_master | bool

- name: Wait for PostgreSQL to start accepting connections
  ansible.builtin.wait_for:
    path: "/var/run/postgresql/.s.PGSQL.5432"
    state: started
    timeout: 30
  when: is_master | bool

- name: Create repmgr user (Master)
  community.postgresql.postgresql_user:
    name: repmgr
    password: "{{ pg_repl_password }}"
    role_attr_flags: "SUPERUSER,REPLICATION"
    login_unix_socket: "/var/run/postgresql"
  become_user: postgres
  when: is_master | bool

- name: Create repmgr database (Master)
  community.postgresql.postgresql_db:
    name: repmgr
    owner: repmgr
  become_user: postgres
  when: is_master | bool

- name: Set password for postgres admin user (Master)
  community.postgresql.postgresql_user:
    name: postgres
    password: "{{ pg_admin_password }}"
  become_user: postgres
  when: is_master | bool

- name: Register Master node in Repmgr
  ansible.builtin.command: repmgr primary register -F
  become_user: postgres
  register: repmgr_primary
  changed_when: "'registered as primary' in repmgr_primary.stdout"
  failed_when:
    - repmgr_primary.rc != 0
    - "'already registered' not in repmgr_primary.stderr and 'already
      registered' not in repmgr_primary.stdout"
  retries: 3
  delay: 5
  until: repmgr_primary.rc == 0 or 'already registered' in repmgr_primary.stderr
    or 'already registered' in repmgr_primary.stdout
  when: is_master | bool

- name: Check if replica is initialized (Slave)
  ansible.builtin.stat:
    path: "{{ pg_data_dir }}/standby.signal"
  register: standby_signal
  when: not is_master | bool

- name: Initialize replica via Repmgr (Slave)
  block:
    - name: Stop PostgreSQL on Slave
      ansible.builtin.service:
        name: postgresql
        state: stopped

    - name: Wipe PG data directory
      ansible.builtin.file:
        path: "{{ pg_data_dir }}"
        state: absent

    - name: Clone standby via repmgr
      ansible.builtin.command: >
        repmgr -h {{ db_node_01 }} -U repmgr -d repmgr -f /etc/repmgr.conf
        standby clone -F
      become_user: postgres
      environment:
        PGPASSWORD: "{{ pg_repl_password }}"
      register: clone_result
      retries: 3
      delay: 10
      until: clone_result.rc == 0

    - name: Start PostgreSQL on Slave
      ansible.builtin.service:
        name: postgresql
        state: started

    - name: Register Standby node in Repmgr
      ansible.builtin.command: repmgr standby register -F
      become_user: postgres
      register: repmgr_standby
      changed_when: "'registered as standby' in repmgr_standby.stdout"
      failed_when:
        - repmgr_standby.rc != 0
        - "'already registered' not in repmgr_standby.stderr and 'already
          registered' not in repmgr_standby.stdout"
      retries: 3
      delay: 5
      until: repmgr_standby.rc == 0 or 'already registered' in repmgr_standby.stderr
        or 'already registered' in repmgr_standby.stdout
  when: not is_master | bool and not standby_signal.stat.exists

- name: Setup Gitea database
  ansible.builtin.include_tasks: gitea.yml
  when: is_master | bool

- name: Ensure repmgrd (Auto-Failover Daemon) is started
  ansible.builtin.service:
    name: repmgrd
    state: started
    enabled: yes

- name: Install postgres_exporter
  ansible.builtin.include_tasks: postgres_exporter.yml
