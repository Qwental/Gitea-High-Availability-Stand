---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: yes
  check_mode: no

- name: Install PostgreSQL packages
  ansible.builtin.apt:
    name:
      - "postgresql-{{ pg_version }}"
      - "postgresql-client-{{ pg_version }}"
      - python3-psycopg2
      - acl
    state: present

- name: Ensure PostgreSQL socket directory exists
  ansible.builtin.file:
    path: /var/run/postgresql
    state: directory
    owner: postgres
    group: postgres
    mode: "2775"

- name: Create systemd override directory for PostgreSQL
  ansible.builtin.file:
    path: /etc/systemd/system/postgresql@.service.d
    state: directory
    mode: "0755"

- name: Override PostgreSQL systemd unit for Docker compatibility
  ansible.builtin.copy:
    dest: /etc/systemd/system/postgresql@.service.d/override.conf
    content: |
      [Service]
      Type=simple
      User=postgres
      Group=postgres
      ExecStart=
      ExecStart=/usr/lib/postgresql/{{ pg_version }}/bin/postgres -D {{ pg_data_dir }} -c config_file={{ pg_conf_dir }}/postgresql.conf
      PIDFile=
    mode: "0644"

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: yes

- name: Deploy postgresql.conf
  ansible.builtin.template:
    src: postgresql.conf.j2
    dest: "{{ pg_conf_dir }}/postgresql.conf"
    owner: postgres
    group: postgres
    mode: "0644"
  notify: restart postgresql

- name: Deploy pg_hba.conf
  ansible.builtin.template:
    src: pg_hba.conf.j2
    dest: "{{ pg_conf_dir }}/pg_hba.conf"
    owner: postgres
    group: postgres
    mode: "0640"
  notify: restart postgresql

- name: Deploy .pgpass for root user
  ansible.builtin.template:
    src: pgpass.j2
    dest: /root/.pgpass
    owner: root
    group: root
    mode: "0600"

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Ensure PostgreSQL is started
  ansible.builtin.service:
    name: postgresql
    state: started
    enabled: yes

- name: Create replication user (Master)
  community.postgresql.postgresql_user:
    name: "{{ pg_repl_user }}"
    password: "{{ pg_repl_password }}"
    role_attr_flags: "REPLICATION"
  become_user: postgres
  when: is_master | bool

- name: Set password for postgres admin user (Master)
  community.postgresql.postgresql_user:
    name: postgres
    password: "{{ pg_admin_password }}"
  become_user: postgres
  when: is_master | bool

- name: Check if replica is initialized (Slave)
  ansible.builtin.stat:
    path: "{{ pg_data_dir }}/standby.signal"
  register: standby_signal
  when: not is_master | bool

- name: Initialize replica (Slave)
  block:
    - name: Stop PostgreSQL
      ansible.builtin.service:
        name: postgresql
        state: stopped

    - name: Wipe data directory
      ansible.builtin.file:
        path: "{{ pg_data_dir }}"
        state: absent

    - name: Run pg_basebackup
      ansible.builtin.command: >
        pg_basebackup -h {{ pg_master_ip }} -D {{ pg_data_dir }} -U {{
        pg_repl_user }} -v -P -X stream -R
      become_user: postgres
      environment:
        PGPASSWORD: "{{ pg_repl_password }}"
      changed_when: true

    - name: Start PostgreSQL
      ansible.builtin.service:
        name: postgresql
        state: started
  when: not is_master | bool and not standby_signal.stat.exists

- name: Setup Gitea database
  ansible.builtin.include_tasks: gitea.yml

- name: Verify replication lag (Master)
  community.postgresql.postgresql_query:
    query: "SELECT abs(pg_wal_lsn_diff(pg_current_wal_lsn(), replay_lsn)) AS lag
      FROM pg_stat_replication"
  become_user: postgres
  register: repl_lag
  when: is_master | bool
  failed_when:
    - repl_lag.query_result | length > 0
    - repl_lag.query_result[0].lag | default(0) | int > 1048576
