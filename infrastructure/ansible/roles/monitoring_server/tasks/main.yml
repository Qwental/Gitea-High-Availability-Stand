- name: Install dependencies for APT repositories
  ansible.builtin.apt:
    name:
      - gnupg
      - software-properties-common
      - curl
    state: present
    update_cache: yes
    cache_valid_time: 3600
  register: apt_res
  until: apt_res is success
  retries: 3
  delay: 5

- name: Set timezone to Europe/Moscow
  community.general.timezone:
    name: Europe/Moscow

- name: Ensure /etc/apt/keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Create monitoring group
  ansible.builtin.group:
    name: monitoring
    system: yes

- name: Create monitoring user
  ansible.builtin.user:
    name: monitoring
    system: yes
    shell: /usr/sbin/nologin
    create_home: no
    group: monitoring

- name: Create monitoring directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: monitoring
    group: monitoring
    mode: "0755"
  loop:
    - /etc/prometheus
    - /var/lib/prometheus
    - /etc/loki
    - /var/lib/loki
    - /etc/alertmanager
    - /var/lib/alertmanager

- name: Download Prometheus archive
  ansible.builtin.get_url:
    url: "https://github.com/prometheus/prometheus/releases/download/v{{ prometheus_version }}/prometheus-{{ prometheus_version }}.linux-{{ target_arch }}.tar.gz"
    dest: "/tmp/prometheus-{{ prometheus_version }}.linux-{{ target_arch }}.tar.gz"
    timeout: 120
    owner: root
    group: root
    mode: "0644"
    checksum: "sha256:https://github.com/prometheus/prometheus/releases/download/v{{ prometheus_version }}/sha256sums.txt"
  register: prometheus_download
  until: prometheus_download is succeeded
  retries: 5
  delay: 10

- name: Extract Prometheus binaries
  ansible.builtin.unarchive:
    src: "/tmp/prometheus-{{ prometheus_version }}.linux-{{ target_arch }}.tar.gz"
    dest: /usr/local/bin/
    remote_src: yes
    extra_opts:
      - "--strip-components=1"
      - "prometheus-{{ prometheus_version }}.linux-{{ target_arch }}/prometheus"
      - "prometheus-{{ prometheus_version }}.linux-{{ target_arch }}/promtool"
    creates: /usr/local/bin/prometheus
  notify: restart monitoring services

- name: Remove temporary Prometheus archive
  ansible.builtin.file:
    path: "/tmp/prometheus-{{ prometheus_version }}.linux-{{ target_arch }}.tar.gz"
    state: absent
  when: prometheus_download is changed

- name: Download Alertmanager archive
  ansible.builtin.get_url:
    url: "https://github.com/prometheus/alertmanager/releases/download/v{{ alertmanager_version }}/alertmanager-{{ alertmanager_version }}.linux-{{ target_arch }}.tar.gz"
    dest: "/tmp/alertmanager-{{ alertmanager_version }}.linux-{{ target_arch }}.tar.gz"
    timeout: 120
    owner: root
    group: root
    mode: "0644"
  register: alertmanager_download
  until: alertmanager_download is succeeded
  retries: 5
  delay: 10

- name: Extract Alertmanager binaries
  ansible.builtin.unarchive:
    src: "/tmp/alertmanager-{{ alertmanager_version }}.linux-{{ target_arch }}.tar.gz"
    dest: /usr/local/bin/
    remote_src: yes
    extra_opts:
      - "--strip-components=1"
      - "alertmanager-{{ alertmanager_version }}.linux-{{ target_arch }}/alertmanager"
      - "alertmanager-{{ alertmanager_version }}.linux-{{ target_arch }}/amtool"
    creates: /usr/local/bin/alertmanager
  notify: restart monitoring services

- name: Remove temporary Alertmanager archive
  ansible.builtin.file:
    path: "/tmp/alertmanager-{{ alertmanager_version }}.linux-{{ target_arch }}.tar.gz"
    state: absent
  when: alertmanager_download is changed

- name: Download Loki archive
  ansible.builtin.get_url:
    url: "https://github.com/grafana/loki/releases/download/v{{ loki_version }}/loki-linux-{{ target_arch }}.zip"
    dest: "/tmp/loki-linux-{{ target_arch }}.zip"
    timeout: 120
    owner: root
    group: root
    mode: "0644"
  register: loki_download
  until: loki_download is succeeded
  retries: 5
  delay: 10

- name: Extract Loki binary
  ansible.builtin.unarchive:
    src: "/tmp/loki-linux-{{ target_arch }}.zip"
    dest: /usr/local/bin/
    remote_src: yes
    creates: "/usr/local/bin/loki-linux-{{ target_arch }}"

- name: Rename Loki binary and set permissions
  ansible.builtin.copy:
    src: "/usr/local/bin/loki-linux-{{ target_arch }}"
    dest: /usr/local/bin/loki
    remote_src: yes
    mode: "0755"
    owner: root
  notify: restart monitoring services

- name: Remove temporary Loki archive
  ansible.builtin.file:
    path: "/tmp/loki-linux-{{ target_arch }}.zip"
    state: absent
  when: loki_download is changed

- name: Deploy Configurations
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: monitoring
    group: monitoring
  loop:
    - { src: "prometheus.yml.j2", dest: "/etc/prometheus/prometheus.yml" }
    - { src: "loki-config.yml.j2", dest: "/etc/loki/loki-config.yml" }
    - { src: "alertmanager.yml.j2", dest: "/etc/alertmanager/alertmanager.yml" }
    - { src: "alerts.yml.j2", dest: "/etc/prometheus/alerts.yml" }
  notify: restart monitoring services

- name: Deploy Systemd Services
  ansible.builtin.template:
    src: "{{ item }}.service.j2"
    dest: "/etc/systemd/system/{{ item }}.service"
  loop:
    - prometheus
    - loki
    - alertmanager
  notify: restart monitoring services

- name: Add Grafana GPG key
  ansible.builtin.get_url:
    url: https://apt.grafana.com/gpg.key
    dest: /etc/apt/keyrings/grafana.asc
    mode: "0644"
    headers:
      User-Agent: "curl/7.68.0"
  register: gpg_result
  until: gpg_result is success
  retries: 3
  delay: 5

- name: Add Grafana APT repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/grafana.asc] https://apt.grafana.com stable main"
    state: present
    filename: grafana

- name: Install Grafana
  ansible.builtin.apt:
    name: grafana
    state: present
    update_cache: yes
    cache_valid_time: 3600

- name: Provision Grafana Datasources
  ansible.builtin.template:
    src: datasources.yml.j2
    dest: /etc/grafana/provisioning/datasources/prometheus-loki.yml
  notify: restart grafana

- name: Set Grafana admin credentials
  ansible.builtin.ini_file:
    path: /etc/grafana/grafana.ini
    section: security
    option: "{{ item.key }}"
    value: "{{ item.value }}"
    owner: root
    group: grafana
    mode: "0640"
  loop:
    - { key: "admin_user", value: "admin" }
    - {
        key: "admin_password",
        value: "{{ vault_grafana_admin_password | default('admin') }}",
      }
  notify: restart grafana

- name: Create Grafana dashboards storage directory
  ansible.builtin.file:
    path: /var/lib/grafana/dashboards
    state: directory
    owner: grafana
    group: grafana
    mode: "0755"

- name: Copy Grafana dashboards from local files
  ansible.builtin.copy:
    src: "dashboards/{{ item }}"
    dest: "/var/lib/grafana/dashboards/{{ item }}"
    owner: grafana
    group: grafana
    mode: "0640"
  loop:
    - gitea_13192.json
    - Node_Exporter_Full_1860.json
    - PostgreSQL_9628.json
    - Alertmanager.json
  notify: restart grafana

- name: Replace Prometheus UID variable in dashboards
  ansible.builtin.replace:
    path: "/var/lib/grafana/dashboards/{{ item }}"
    regexp: "(?i)\\$\\{DS_PROMETHEUS\\}"
    replace: "{{ grafana_prometheus_uid | default('prometheus-internal') }}"
  loop:
    - gitea_13192.json
    - Node_Exporter_Full_1860.json
    - PostgreSQL_9628.json
    - Alertmanager.json

- name: Replace Loki UID variable in dashboards
  ansible.builtin.replace:
    path: "/var/lib/grafana/dashboards/{{ item }}"
    regexp: "(?i)\\$\\{DS_LOKI\\}"
    replace: "{{ grafana_loki_uid | default('loki-internal') }}"
  loop:
    - gitea_13192.json
    - Node_Exporter_Full_1860.json
    - PostgreSQL_9628.json
    - Alertmanager.json

- name: Configure Grafana dashboard provisioning
  ansible.builtin.copy:
    dest: /etc/grafana/provisioning/dashboards/default.yml
    owner: root
    group: grafana
    mode: "0640"
    content: |
      apiVersion: 1
      providers:
        - name: 'default'
          orgId: 1
          folder: 'Gitea Platform'
          type: file
          disableDeletion: false
          updateIntervalSeconds: 10
          options:
            path: /var/lib/grafana/dashboards
  notify: restart grafana

- name: Flush handlers to apply configurations and start services
  ansible.builtin.meta: flush_handlers

- name: Ensure all services are running and enabled on boot
  ansible.builtin.service:
    name: "{{ item }}"
    state: started
    enabled: yes
  loop:
    - prometheus
    - loki
    - alertmanager
    - grafana-server

- name: Verify Prometheus is healthy
  ansible.builtin.uri:
    url: "http://localhost:9090/-/healthy"
    method: GET
    status_code: 200
  register: prometheus_health
  until: prometheus_health.status == 200
  retries: 6
  delay: 10

- name: Verify Loki is ready
  ansible.builtin.uri:
    url: "http://localhost:3100/ready"
    method: GET
    status_code: 200
  register: loki_health
  until: loki_health.status == 200
  retries: 6
  delay: 10

- name: Verify Alertmanager is healthy
  ansible.builtin.uri:
    url: "http://localhost:9093/-/healthy"
    method: GET
    status_code: 200
  register: alertmanager_health
  until: alertmanager_health.status == 200
  retries: 6
  delay: 10

- name: Verify Grafana is healthy
  ansible.builtin.uri:
    url: "http://localhost:3000/api/health"
    method: GET
    status_code: 200
  register: grafana_health
  until: grafana_health.status == 200
  retries: 6
  delay: 10
