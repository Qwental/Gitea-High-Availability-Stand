---
- name: Install dependencies for APT repositories
  ansible.builtin.apt:
    name:
      - gnupg
      - software-properties-common
      - curl
    state: present
    update_cache: yes
  register: apt_res
  until: apt_res is success
  retries: 3
  delay: 5

- name: Set timezone
  ansible.builtin.command:
    cmd: timedatectl set-timezone Europe/Moscow
  changed_when: false
  
- name: Ensure /etc/apt/keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Create monitoring directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: monitoring
    group: monitoring
    mode: "0755"
  loop:
    - /etc/prometheus
    - /var/lib/prometheus
    - /etc/loki
    - /var/lib/loki
    - /etc/alertmanager
    - /var/lib/alertmanager

- name: Download Prometheus, Loki, Alertmanager
  ansible.builtin.unarchive:
    src: "{{ item.url }}"
    dest: /tmp/
    remote_src: yes
  loop:
    - {
        url: "https://github.com/prometheus/prometheus/releases/download/v{{
          prometheus_version }}/prometheus-{{ prometheus_version
          }}.linux-arm64.tar.gz",
      }
    - {
        url: "https://github.com/grafana/loki/releases/download/v{{ loki_version
          }}/loki-linux-arm64.zip",
      }
    - {
        url: "https://github.com/prometheus/alertmanager/releases/download/v{{
          alertmanager_version }}/alertmanager-{{ alertmanager_version
          }}.linux-arm64.tar.gz",
      }

- name: Install Binaries
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "0755"
    remote_src: yes
  loop:
    - {
        src: "/tmp/prometheus-{{ prometheus_version }}.linux-arm64/prometheus",
        dest: "/usr/local/bin/prometheus",
      }
    - {
        src: "/tmp/prometheus-{{ prometheus_version }}.linux-arm64/promtool",
        dest: "/usr/local/bin/promtool",
      }
    - { src: "/tmp/loki-linux-arm64", dest: "/usr/local/bin/loki" }
    - {
        src: "/tmp/alertmanager-{{ alertmanager_version }}.linux-arm64/alertmanager",
        dest: "/usr/local/bin/alertmanager",
      }
  retries: 3
  delay: 5

- name: Deploy Configurations
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: monitoring
    group: monitoring
  loop:
    - { src: "prometheus.yml.j2", dest: "/etc/prometheus/prometheus.yml" }
    - { src: "loki-config.yml.j2", dest: "/etc/loki/loki-config.yml" }
    - { src: "alertmanager.yml.j2", dest: "/etc/alertmanager/alertmanager.yml" }
    - { src: "alerts.yml.j2", dest: "/etc/prometheus/alerts.yml" }
  notify: restart monitoring services

- name: Deploy Systemd Services
  ansible.builtin.template:
    src: "{{ item }}.service.j2"
    dest: "/etc/systemd/system/{{ item }}.service"
  loop:
    - prometheus
    - loki
    - alertmanager
  notify: restart monitoring services

- name: Add Grafana GPG key
  ansible.builtin.get_url:
    url: https://apt.grafana.com/gpg.key
    dest: /etc/apt/keyrings/grafana.asc
    mode: "0644"
    headers:
      User-Agent: "curl/7.68.0"
  register: gpg_result
  until: gpg_result is success
  retries: 3
  delay: 5

- name: Add Grafana APT repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/grafana.asc] https://apt.grafana.com
      stable main"
    state: present
    filename: grafana

- name: Install Grafana
  ansible.builtin.apt:
    name: grafana
    state: present
    update_cache: yes

- name: Provision Grafana Datasources
  ansible.builtin.template:
    src: datasources.yml.j2
    dest: /etc/grafana/provisioning/datasources/prometheus-loki.yml
  notify: restart grafana

- name: Flush handlers to start services
  ansible.builtin.meta: flush_handlers

- name: Ensure all services are running
  ansible.builtin.service:
    name: "{{ item }}"
    state: started
    enabled: yes
  loop:
    - prometheus
    - loki
    - alertmanager
    - grafana-server
