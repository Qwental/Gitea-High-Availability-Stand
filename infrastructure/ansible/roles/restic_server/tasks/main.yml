- name: Set timezone to Europe/Moscow
  community.general.timezone:
    name: Europe/Moscow

- name: Install required packages
  ansible.builtin.apt:
    name:
      - apache2-utils
      - python3-passlib
      - cron
      - restic
    state: present
    update_cache: yes
    cache_valid_time: 3600
  register: apt_res
  until: apt_res is success
  retries: 3
  delay: 5

- name: Create backup group
  ansible.builtin.group:
    name: backup
    system: yes

- name: Create backup user
  ansible.builtin.user:
    name: backup
    group: backup
    system: yes
    create_home: no

- name: Create backup data directory
  ansible.builtin.file:
    path: /backup/restic
    state: directory
    owner: backup
    group: backup
    mode: "0700"

- name: Download rest-server archive
  ansible.builtin.get_url:
    url: "https://github.com/restic/rest-server/releases/download/v0.14.0/rest-server_0.14.0_linux_{{ target_arch }}.tar.gz"
    dest: "/tmp/rest-server_0.14.0_linux_{{ target_arch }}.tar.gz"
    timeout: 120
    owner: root
    group: root
    mode: "0644"
  register: rest_server_download
  until: rest_server_download is succeeded
  retries: 5
  delay: 10

- name: Extract rest-server binary
  ansible.builtin.unarchive:
    src: "/tmp/rest-server_0.14.0_linux_{{ target_arch }}.tar.gz"
    dest: /usr/local/bin/
    remote_src: yes
    extra_opts:
      - "--strip-components=1"
      - "rest-server_0.14.0_linux_{{ target_arch }}/rest-server"
    creates: /usr/local/bin/rest-server
  notify: restart rest-server

- name: Remove temporary rest-server archive
  ansible.builtin.file:
    path: "/tmp/rest-server_0.14.0_linux_{{ target_arch }}.tar.gz"
    state: absent
  when: rest_server_download is changed

- name: Set permissions for rest-server binary
  ansible.builtin.file:
    path: /usr/local/bin/rest-server
    mode: "0755"
    owner: root
    group: root

- name: Check if .htpasswd exists
  ansible.builtin.stat:
    path: /backup/restic/.htpasswd
  register: htpasswd_file

- name: Create .htpasswd file for REST API auth
  ansible.builtin.command:
    cmd: "htpasswd -B -b -c /backup/restic/.htpasswd {{ restic_rest_user }} {{ restic_rest_password }}"
  when: not htpasswd_file.stat.exists
  notify: restart rest-server

- name: Set permissions on .htpasswd
  ansible.builtin.file:
    path: /backup/restic/.htpasswd
    owner: backup
    group: backup
    mode: "0600"

- name: Deploy rest-server systemd unit
  ansible.builtin.template:
    src: rest-server.service.j2
    dest: /etc/systemd/system/rest-server.service
  notify: restart rest-server

- name: Ensure rest-server is started and enabled
  ansible.builtin.systemd:
    name: rest-server
    state: started
    enabled: yes
    daemon_reload: yes
  register: rest_server_service
  until: rest_server_service is success
  retries: 5
  delay: 10

- name: Deploy prune cron job wrapper
  ansible.builtin.template:
    src: prune.sh.j2
    dest: /usr/local/bin/restic-prune.sh
    mode: "0700"

- name: Ensure cron service is started and enabled
  ansible.builtin.systemd:
    name: cron
    state: started
    enabled: yes

- name: Setup daily cron for pruning
  ansible.builtin.cron:
    name: "Restic Prune"
    minute: "0"
    hour: "4"
    job: "/usr/local/bin/restic-prune.sh >> /var/log/restic-prune.log 2>&1"
