- name: Create required Ganesha directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /var/run/ganesha
    - /var/log/ganesha
    - /etc/systemd/system/nfs-ganesha.service.d

- name: Override NFS-Ganesha systemd unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/nfs-ganesha.service.d/override.conf
    content: |
      [Service]
      Type=simple
      ProtectSystem=off
      ProtectHome=off
      PrivateTmp=no
      ExecStart=
      ExecStart=/usr/bin/ganesha.nfsd -F -L /var/log/ganesha/ganesha.log -f /etc/ganesha/ganesha.conf
    mode: "0644"

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: yes

- name: Configure NFS-Ganesha export
  ansible.builtin.template:
    src: ganesha.conf.j2
    dest: /etc/ganesha/ganesha.conf
  notify: Restart NFS-Ganesha

- name: Flush handlers to ensure Ganesha is ready before clients connect
  ansible.builtin.meta: flush_handlers

- name: Ensure NFS-Ganesha is running
  ansible.builtin.service:
    name: nfs-ganesha
    state: started
    enabled: yes
