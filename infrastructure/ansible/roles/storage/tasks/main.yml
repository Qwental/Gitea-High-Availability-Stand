---
- name: Install tzdata
  ansible.builtin.apt:
    name: tzdata
    state: present
  retries: 3
  delay: 10 

- name: Set timezone
  ansible.builtin.command:
    cmd: timedatectl set-timezone Europe/Moscow
  changed_when: false
  
- name: Install dependencies
  ansible.builtin.apt:
    name:
      - glusterfs-server
      - nfs-ganesha
      - nfs-ganesha-gluster
      - rpcbind
    state: present
    update_cache: yes
  retries: 3
  delay: 10

- name: Start required base services
  ansible.builtin.service:
    name: "{{ item }}"
    state: started
    enabled: yes
  loop:
    - rpcbind
    - glusterd

- name: Probe GlusterFS peers
  ansible.builtin.command: gluster peer probe 172.20.0.42
  when: inventory_hostname == 'storage-01'
  register: peer_probe
  changed_when: "'success' in peer_probe.stdout"
  failed_when: false

- name: Ensure correct ownership for Gitea data on GlusterFS brick
  ansible.builtin.file:
    path: /data/brick1/gv0
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0755"

- name: Create GlusterFS volume
  ansible.builtin.command: >
    gluster volume create gitea_vol replica 2 172.20.0.41:/data/brick1/gv0
    172.20.0.42:/data/brick1/gv0 force
  when: inventory_hostname == 'storage-01'
  register: gluster_create
  changed_when: "'success' in gluster_create.stdout"
  failed_when: "'already exists' not in gluster_create.stderr and gluster_create.rc != 0"

- name: Start GlusterFS volume
  ansible.builtin.command: gluster volume start gitea_vol
  when: inventory_hostname == 'storage-01'
  register: gluster_start
  changed_when: "'success' in gluster_start.stdout"
  failed_when: "'already started' not in gluster_start.stderr and gluster_start.rc != 0"
  notify: Restart NFS-Ganesha

