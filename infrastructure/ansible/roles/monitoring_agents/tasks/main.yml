---
- name: Install required utilities
  ansible.builtin.apt:
    name:
      - unzip
      - tar
    state: present
    update_cache: yes
  register: apt_res
  until: apt_res is success
  retries: 3
  delay: 5

- name: Set timezone to Europe/Moscow
  community.general.timezone:
    name: Europe/Moscow

- name: Create monitoring system group
  ansible.builtin.group:
    name: monitoring
    system: yes

- name: Create monitoring system user
  ansible.builtin.user:
    name: monitoring
    group: monitoring
    system: yes
    create_home: no
    shell: /usr/sbin/nologin

- name: Download Node Exporter archive
  ansible.builtin.get_url:
    url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-{{ target_arch }}.tar.gz"
    dest: "/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ target_arch }}.tar.gz"
    timeout: 120
    mode: "0644"
  register: node_exporter_download
  until: node_exporter_download is succeeded
  retries: 5
  delay: 10

- name: Extract Node Exporter binary
  ansible.builtin.unarchive:
    src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ target_arch }}.tar.gz"
    dest: /usr/local/bin/
    remote_src: yes
    extra_opts:
      - "--strip-components=1"
      - "node_exporter-{{ node_exporter_version }}.linux-{{ target_arch }}/node_exporter"
    creates: /usr/local/bin/node_exporter
  notify: restart node_exporter

- name: Download Promtail archive
  ansible.builtin.get_url:
    url: "https://github.com/grafana/loki/releases/download/v{{ promtail_version }}/promtail-linux-{{ target_arch }}.zip"
    dest: "/tmp/promtail-linux-{{ target_arch }}.zip"
    timeout: 120
    mode: "0644"
  register: promtail_download
  until: promtail_download is succeeded
  retries: 5
  delay: 10

- name: Extract Promtail binary
  ansible.builtin.unarchive:
    src: "/tmp/promtail-linux-{{ target_arch }}.zip"
    dest: /usr/local/bin/
    remote_src: yes
    creates: "/usr/local/bin/promtail-linux-{{ target_arch }}"
  notify: restart promtail

- name: Create Promtail config directory
  ansible.builtin.file:
    path: /etc/promtail
    state: directory
    owner: monitoring
    group: monitoring

- name: Ensure promtail data directory exists
  ansible.builtin.file:
    path: /var/lib/promtail
    state: directory
    mode: "0755"

- name: Deploy Promtail config
  ansible.builtin.template:
    src: promtail.yaml.j2
    dest: /etc/promtail/promtail.yaml
    owner: monitoring
    group: monitoring
    mode: "0644"
  notify: restart promtail

- name: Deploy Node Exporter systemd unit
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    mode: "0644"
  notify: restart node_exporter

- name: Deploy Promtail systemd unit
  ansible.builtin.template:
    src: promtail.service.j2
    dest: /etc/systemd/system/promtail.service
    mode: "0644"
  notify: restart promtail

- name: Configure journald
  ansible.builtin.import_tasks: journald.yml

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: yes

- name: Flush handlers to start agents
  ansible.builtin.meta: flush_handlers

- name: Ensure agents are started and enabled
  ansible.builtin.service:
    name: "{{ item }}"
    state: started
    enabled: yes
  loop:
    - node_exporter
    - promtail
