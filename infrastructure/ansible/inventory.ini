[all:vars]
ansible_connection=docker
ansible_user=root
ansible_remote_tmp=/tmp/.ansible
ansible_python_interpreter=/usr/bin/python3
target_arch=arm64

[db_cluster]
db-node-01 ansible_host=db-node-01 ip_addr=172.20.0.21 is_master=true node_id=1 keepalived_role=MASTER keepalived_priority=110 peer_ip=172.20.0.22
db-node-02 ansible_host=db-node-02 ip_addr=172.20.0.22 is_master=false node_id=2 keepalived_role=BACKUP keepalived_priority=100 peer_ip=172.20.0.21

[db_cluster:vars]
vip_address=172.20.0.10
vrrp_router_id=51

[gitea_servers]
gitea-node-01 ansible_host=gitea-node-01 ip_addr=172.20.0.11
gitea-node-02 ansible_host=gitea-node-02 ip_addr=172.20.0.12

[storage_cluster]
storage-01 ansible_host=storage-01 ip_addr=172.20.0.41 keepalived_role=MASTER keepalived_priority=110 peer_ip=172.20.0.42
storage-02 ansible_host=storage-02 ip_addr=172.20.0.42 keepalived_role=BACKUP keepalived_priority=100 peer_ip=172.20.0.41

[storage_cluster:vars]
vip_address=172.20.0.40
vrrp_router_id=52

[gitea_proxies]
gitea-proxy-01 ansible_host=gitea-proxy-01 ip_addr=172.20.0.15 keepalived_role=MASTER keepalived_priority=110 peer_ip=172.20.0.16 proxy_type=gitea
gitea-proxy-02 ansible_host=gitea-proxy-02 ip_addr=172.20.0.16 keepalived_role=BACKUP keepalived_priority=100 peer_ip=172.20.0.15 proxy_type=gitea

[gitea_proxies:vars]
vip_address=172.20.0.20
vrrp_router_id=53

[backup]
backup-srv ansible_host=backup-srv ip_addr=172.20.0.60

[monitoring_server]
monitor-node-01 ansible_host=monitor-node-01 ip_addr=172.20.0.50

[infrastructure:children]
db_cluster
gitea_servers
storage_cluster
backup
monitoring_server
gitea_proxies