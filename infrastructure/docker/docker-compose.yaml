services:

  db-node-01:
    build: { context: ., dockerfile: node-ubuntu.Dockerfile }
    hostname: db-node-01
    container_name: db-node-01
    privileged: true
    networks:
      lab-internal-net: { ipv4_address: $IP_DB_NODE_01 }
    volumes: [ "/sys/fs/cgroup:/sys/fs/cgroup:rw", "db-data-01:/var/lib/postgresql" ]
    cap_add: [ NET_ADMIN, NET_RAW ]

  db-node-02:
    build: { context: ., dockerfile: node-ubuntu.Dockerfile }
    container_name: db-node-02
    hostname: db-node-02
    privileged: true
    networks:
      lab-internal-net: { ipv4_address: $IP_DB_NODE_02 }
    volumes: [ "/sys/fs/cgroup:/sys/fs/cgroup:rw", "db-data-02:/var/lib/postgresql" ]
    cap_add: [ NET_ADMIN, NET_RAW ]

  gitea-node-01:
    build: { context: ., dockerfile: node-ubuntu.Dockerfile }
    container_name: gitea-node-01
    hostname: gitea-node-01
    privileged: true
    networks:
      lab-internal-net: { ipv4_address: $IP_GITEA_NODE_01 }
    volumes: [ "/sys/fs/cgroup:/sys/fs/cgroup:rw", "gitea-data-01:/var/lib/gitea" ]
    cap_add: [ NET_ADMIN, NET_RAW ]

  gitea-node-02:
    build: { context: ., dockerfile: node-ubuntu.Dockerfile }
    container_name: gitea-node-02
    privileged: true
    hostname: gitea-node-02
    networks:
      lab-internal-net: { ipv4_address: $IP_GITEA_NODE_02 }
    volumes: [ "/sys/fs/cgroup:/sys/fs/cgroup:rw", "gitea-data-02:/var/lib/gitea" ]
    cap_add: [ NET_ADMIN, NET_RAW ]

  storage-01:
    build: { context: ., dockerfile: node-ubuntu.Dockerfile }
    container_name: storage-01
    privileged: true
    hostname: storage-01
    networks:
      lab-internal-net: { ipv4_address: $IP_STORAGE_NODE_01 }
    volumes: [ "/sys/fs/cgroup:/sys/fs/cgroup:rw", "nfs-data-01:/data/brick1" ]
    cap_add: [ NET_ADMIN, NET_RAW, SYS_ADMIN ]

  storage-02:
    build: { context: ., dockerfile: node-ubuntu.Dockerfile }
    container_name: storage-02
    privileged: true
    hostname: storage-02
    networks:
      lab-internal-net: { ipv4_address: $IP_STORAGE_NODE_02 }
    volumes: [ "/sys/fs/cgroup:/sys/fs/cgroup:rw", "nfs-data-02:/data/brick1" ]
    cap_add: [ NET_ADMIN, NET_RAW, SYS_ADMIN ]

  db-proxy:
    build: { context: ., dockerfile: node-ubuntu.Dockerfile }
    container_name: db-proxy
    hostname: db-proxy
    privileged: true
    networks:
      lab-internal-net: { ipv4_address: $IP_DB_VIP }
    volumes: [ "/sys/fs/cgroup:/sys/fs/cgroup:rw" ]
    cap_add: [ NET_ADMIN, NET_RAW ]

  gitea-proxy:
    build: { context: ., dockerfile: node-ubuntu.Dockerfile }
    container_name: gitea-proxy
    privileged: true
    hostname: gitea-proxy
    ports: [ "3000:3000", "2222:2222" ]
    networks:
      lab-internal-net: { ipv4_address: $IP_GITEA_VIP }
    volumes: [ "/sys/fs/cgroup:/sys/fs/cgroup:rw" ]
    cap_add: [ NET_ADMIN, NET_RAW ]

  nfs-proxy:
    build: { context: ., dockerfile: node-ubuntu.Dockerfile }
    container_name: nfs-proxy
    privileged: true
    hostname: nfs-proxy
    networks:
      lab-internal-net: { ipv4_address: $IP_STORAGE_VIP }
    volumes: [ "/sys/fs/cgroup:/sys/fs/cgroup:rw" ]
    cap_add: [ NET_ADMIN, NET_RAW ]

  monitor-node-01:
    build: { context: ., dockerfile: node-ubuntu.Dockerfile }
    hostname: monitor-node-01
    container_name: monitor-node-01
    privileged: true
    ports:
      - "3001:3000" # Grafana
      - "9090:9090" # Prometheus
    networks:
      lab-internal-net: { ipv4_address: $IP_MONITOR_NODE_01 }
    volumes:
      - "/sys/fs/cgroup:/sys/fs/cgroup:rw"
      - "prometheus-data:/var/lib/prometheus"
      - "loki-data:/var/lib/loki"
      - "alertmanager-data:/var/lib/alertmanager"
      - "grafana-data:/var/lib/grafana"
    cap_add: [ NET_ADMIN, NET_RAW ]

  backup-srv:
    build: { context: ., dockerfile: node-ubuntu.Dockerfile }
    container_name: backup-srv
    hostname: backup-srv

    privileged: true

    restart: unless-stopped

    networks:
      lab-internal-net:
        ipv4_address: $IP_BACKUP_NODE

    volumes:
      - "/sys/fs/cgroup:/sys/fs/cgroup:rw"

      - "backup-data:/backup"

      - "db-data-01:/source/db-node-01:ro"
      - "db-data-02:/source/db-node-02:ro"
      - "gitea-data-01:/source/gitea-node-01:ro"
      - "gitea-data-02:/source/gitea-node-02:ro"
      - "nfs-data-01:/source/storage-01:ro"
      - "nfs-data-02:/source/storage-02:ro"

    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN

    environment:
      TZ: UTC

networks:
  lab-internal-net:
    name: lab-internal-net
    driver: bridge
    ipam:
      config:
        - subnet: ${SUBNET_CIDR}
          gateway: ${GATEWAY_IP}

volumes:
  db-data-01:
  db-data-02:
  gitea-data-01:
  gitea-data-02:
  nfs-data-01:
  nfs-data-02:
  prometheus-data:
  loki-data:
  alertmanager-data:
  grafana-data:
  backup-data:
