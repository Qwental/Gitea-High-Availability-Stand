services:

  db-node-01:
    build: { context: ., dockerfile: node-ubuntu.Dockerfile }
    hostname: db-node-01
    container_name: db-node-01
    privileged: true
    networks:
      lab-internal-net: { ipv4_address: $IP_DB_NODE_01 }
    volumes: [ "/sys/fs/cgroup:/sys/fs/cgroup:rw", "db-data-01:/var/lib/postgresql" ]

  db-node-02:
    build: { context: ., dockerfile: node-ubuntu.Dockerfile }
    container_name: db-node-02
    hostname: db-node-02
    privileged: true
    networks:
      lab-internal-net: { ipv4_address: $IP_DB_NODE_02 }
    volumes: [ "/sys/fs/cgroup:/sys/fs/cgroup:rw", "db-data-02:/var/lib/postgresql" ]

  gitea-node-01:
    build: { context: ., dockerfile: node-ubuntu.Dockerfile }
    container_name: gitea-node-01
    hostname: gitea-node-01
    privileged: true
    networks:
      lab-internal-net: { ipv4_address: $IP_GITEA_NODE_01 }
    volumes: [ "/sys/fs/cgroup:/sys/fs/cgroup:rw", "gitea-data-01:/var/lib/gitea" ]

  gitea-node-02:
    build: { context: ., dockerfile: node-ubuntu.Dockerfile }
    container_name: gitea-node-02
    privileged: true
    hostname: gitea-node-02
    networks:
      lab-internal-net: { ipv4_address: $IP_GITEA_NODE_02 }
    volumes: [ "/sys/fs/cgroup:/sys/fs/cgroup:rw", "gitea-data-02:/var/lib/gitea" ]

  storage-01:
    build: { context: ., dockerfile: node-ubuntu.Dockerfile }
    container_name: storage-01
    privileged: true
    hostname: storage-01
    networks:
      lab-internal-net: { ipv4_address: $IP_STORAGE_NODE_01 }
    volumes: [ "/sys/fs/cgroup:/sys/fs/cgroup:rw", "nfs-data-01:/data/brick1" ]

  storage-02:
    build: { context: ., dockerfile: node-ubuntu.Dockerfile }
    container_name: storage-02
    privileged: true
    hostname: storage-02
    networks:
      lab-internal-net: { ipv4_address: $IP_STORAGE_NODE_02 }
    volumes: [ "/sys/fs/cgroup:/sys/fs/cgroup:rw", "nfs-data-02:/data/brick1" ]

  gitea-proxy-01:
    build: { context: ., dockerfile: node-ubuntu.Dockerfile }
    container_name: gitea-proxy-01
    privileged: true
    hostname: gitea-proxy-01
    ports: [ "3000:3000", "2222:2222" ]
    networks:
      lab-internal-net: { ipv4_address: $IP_GITEA_PROXY_01 }
    volumes: [ "/sys/fs/cgroup:/sys/fs/cgroup:rw" ]

  gitea-proxy-02:
    build: { context: ., dockerfile: node-ubuntu.Dockerfile }
    container_name: gitea-proxy-02
    privileged: true
    hostname: gitea-proxy-02
    ports: [ "3002:3000", "2223:2222" ]
    networks:
      lab-internal-net: { ipv4_address: $IP_GITEA_PROXY_02 }
    volumes: [ "/sys/fs/cgroup:/sys/fs/cgroup:rw" ]

  monitor-node-01:
    build: { context: ., dockerfile: node-ubuntu.Dockerfile }
    hostname: monitor-node-01
    container_name: monitor-node-01
    privileged: true
    ports:
      - "3001:3000" # Grafana
      - "9090:9090" # Prometheus
    networks:
      lab-internal-net: { ipv4_address: $IP_MONITOR_NODE_01 }
    volumes:
      - "/sys/fs/cgroup:/sys/fs/cgroup:rw"
      - "prometheus-data:/var/lib/prometheus"
      - "loki-data:/var/lib/loki"
      - "alertmanager-data:/var/lib/alertmanager"
      - "grafana-data:/var/lib/grafana"

  backup-srv:
    build: { context: ., dockerfile: node-ubuntu.Dockerfile }
    container_name: backup-srv
    hostname: backup-srv
    privileged: true
    restart: unless-stopped
    networks:
      lab-internal-net:
        ipv4_address: $IP_BACKUP_NODE
    volumes:
      - "/sys/fs/cgroup:/sys/fs/cgroup:rw"
      - "backup-data:/backup"

networks:
  lab-internal-net:
    name: lab-internal-net
    driver: bridge
    ipam:
      config:
        - subnet: ${SUBNET_CIDR}
          gateway: ${GATEWAY_IP}

volumes:
  db-data-01:
  db-data-02:
  gitea-data-01:
  gitea-data-02:
  nfs-data-01:
  nfs-data-02:
  prometheus-data:
  loki-data:
  alertmanager-data:
  grafana-data:
  backup-data:
