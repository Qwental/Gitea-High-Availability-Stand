services:
  db-node-01:
    build: { context: ., dockerfile: node-ubuntu.Dockerfile }
    container_name: db-node-01
    privileged: true
    networks:
      lab-internal-net: { ipv4_address: $IP_DB_NODE_01 }
    volumes: [ "/sys/fs/cgroup:/sys/fs/cgroup:rw", "db-data-01:/var/lib/postgresql" ]
    cap_add: [ NET_ADMIN, NET_RAW ]

  db-node-02:
    build: { context: ., dockerfile: node-ubuntu.Dockerfile }
    container_name: db-node-02
    privileged: true
    networks:
      lab-internal-net: { ipv4_address: $IP_DB_NODE_02 }
    volumes: [ "/sys/fs/cgroup:/sys/fs/cgroup:rw", "db-data-02:/var/lib/postgresql" ]
    cap_add: [ NET_ADMIN, NET_RAW ]

  gitea-node-01:
    build: { context: ., dockerfile: node-ubuntu.Dockerfile }
    container_name: gitea-node-01
    privileged: true
    networks:
      lab-internal-net: { ipv4_address: $IP_GITEA_NODE_01 }
    volumes: [ "/sys/fs/cgroup:/sys/fs/cgroup:rw", "gitea-data-01:/var/lib/gitea" ]
    cap_add: [ NET_ADMIN, NET_RAW ]

  gitea-node-02:
    build: { context: ., dockerfile: node-ubuntu.Dockerfile }
    container_name: gitea-node-02
    privileged: true
    networks:
      lab-internal-net: { ipv4_address: $IP_GITEA_NODE_02 }
    volumes: [ "/sys/fs/cgroup:/sys/fs/cgroup:rw", "gitea-data-02:/var/lib/gitea" ]
    cap_add: [ NET_ADMIN, NET_RAW ]

  jenkins-master:
    build: { context: ., dockerfile: node-ubuntu.Dockerfile }
    container_name: jenkins-master
    privileged: true
    networks:
      lab-internal-net: { ipv4_address: $IP_JENKINS }
    volumes: [ "/sys/fs/cgroup:/sys/fs/cgroup:rw" ]

  jenkins-worker-01:
    build: { context: ., dockerfile: node-ubuntu.Dockerfile }
    container_name: jenkins-worker-01
    privileged: true
    networks:
      lab-internal-net: { ipv4_address: $IP_WORKER }
    volumes: [ "/sys/fs/cgroup:/sys/fs/cgroup:rw" ]

  deploy-target-01:
    build: { context: ., dockerfile: node-ubuntu.Dockerfile }
    container_name: deploy-target-01
    privileged: true
    networks:
      lab-internal-net: { ipv4_address: $IP_DEPLOY_TARGET }
    volumes: [ "/sys/fs/cgroup:/sys/fs/cgroup:rw" ]

  storage-01:
    build: { context: ., dockerfile: node-ubuntu.Dockerfile }
    container_name: storage-01
    privileged: true
    networks:
      lab-internal-net: { ipv4_address: $IP_STORAGE_NODE_01 }
    volumes: [ "/sys/fs/cgroup:/sys/fs/cgroup:rw", "nfs-data-01:/data/brick1" ]
    cap_add: [ NET_ADMIN, NET_RAW, SYS_ADMIN ]

  storage-02:
    build: { context: ., dockerfile: node-ubuntu.Dockerfile }
    container_name: storage-02
    privileged: true
    networks:
      lab-internal-net: { ipv4_address: $IP_STORAGE_NODE_02 }
    volumes: [ "/sys/fs/cgroup:/sys/fs/cgroup:rw", "nfs-data-02:/data/brick1" ]
    cap_add: [ NET_ADMIN, NET_RAW, SYS_ADMIN ]

  db-proxy:
    build: { context: ., dockerfile: node-ubuntu.Dockerfile }
    container_name: db-proxy
    privileged: true
    networks:
      lab-internal-net: { ipv4_address: $IP_DB_VIP }
    volumes: [ "/sys/fs/cgroup:/sys/fs/cgroup:rw" ]
    cap_add: [ NET_ADMIN, NET_RAW ]

  gitea-proxy:
    build: { context: ., dockerfile: node-ubuntu.Dockerfile }
    container_name: gitea-proxy
    privileged: true
    ports: [ "3000:3000", "2222:2222" ]
    networks:
      lab-internal-net: { ipv4_address: $IP_GITEA_VIP }
    volumes: [ "/sys/fs/cgroup:/sys/fs/cgroup:rw" ]
    cap_add: [ NET_ADMIN, NET_RAW ]

  nfs-proxy:
    build: { context: ., dockerfile: node-ubuntu.Dockerfile }
    container_name: nfs-proxy
    privileged: true
    networks:
      lab-internal-net: { ipv4_address: $IP_STORAGE_VIP }
    volumes: [ "/sys/fs/cgroup:/sys/fs/cgroup:rw" ]
    cap_add: [ NET_ADMIN, NET_RAW ]

networks:
  lab-internal-net:
    name: lab-internal-net
    driver: bridge
    ipam:
      config:
        - subnet: ${SUBNET_CIDR}
          gateway: ${GATEWAY_IP}

volumes:
  db-data-01:
  db-data-02:
  gitea-data-01:
  gitea-data-02:
  nfs-data-01:
  nfs-data-02:
