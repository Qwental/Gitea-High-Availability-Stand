defaults
    timeout connect 5s
    timeout client 1h
    timeout server 1h

listen gitea-web
    bind *:3000
    mode http
    option httpchk GET /
    server gitea-node-01 172.20.0.11:3000 check inter 2s
    server gitea-node-02 172.20.0.12:3000 check inter 2s backup

listen gitea-ssh
    bind *:22
    mode tcp
    server gitea-node-01 172.20.0.11:22 check inter 2s
    server gitea-node-02 172.20.0.12:22 check inter 2s backup
